apiVersion: v1
kind: Pod
metadata:
  name: pss-demo
  namespace: pss-test
  labels:
    app: pss-demo
spec:
  hostPID: true
  hostNetwork: true
  hostIPC: true
  containers:
  - name: demo
    image: ubuntu:22.04
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      capabilities:
        add:
        - SYS_ADMIN
        - NET_ADMIN
      runAsUser: 0
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
      type: Directory

