# Isolate production namespace
# This should be applied in the production namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-other-namespaces
  namespace: production
spec:
  podSelector: {}  # Applies to all pods in production namespace
  policyTypes:
  - Ingress
  ingress:
  # Only allow traffic from same namespace
  - from:
    - podSelector: {}
