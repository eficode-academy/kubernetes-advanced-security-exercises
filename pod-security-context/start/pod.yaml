apiVersion: v1
kind: Pod
metadata:
  name: security-demo
  labels:
    app: security-demo
spec:
  containers:
  - name: app
    image: ubuntu:22.04
    command:
      - /bin/bash
      - -c
      - |
        echo "Container started. Running as: $(id)"
        # Keep container running
        while true; do sleep 3600; done
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
