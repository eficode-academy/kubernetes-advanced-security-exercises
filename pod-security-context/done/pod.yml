apiVersion: v1
kind: Pod
metadata:
  name: security-demo
  labels:
    app: security-demo
spec:
  # Pod-level security context
  securityContext:
    # Ensure container doesn't run as root
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    # Use secure seccomp profile
    seccompProfile:
      type: RuntimeDefault
  
  containers:
  - name: app
    image: ubuntu:22.04
    command:
      - /bin/bash
      - -c
      - |
        echo "Secure container started!"
        echo "Running as: $(id)"
        echo "Filesystem is read-only except for /tmp"
        # Keep container running
        while true; do sleep 3600; done
    
    # Container-level security context
    securityContext:
      # Make root filesystem read-only to prevent malware persistence
      readOnlyRootFilesystem: true
      
      # Prevent privilege escalation
      allowPrivilegeEscalation: false
      
      # Drop all Linux capabilities
      capabilities:
        drop:
          - ALL
      
      # Ensure running as non-root
      runAsNonRoot: true
      runAsUser: 10000
    
    # Mount writable directories where needed
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: cache
      mountPath: /var/cache
    
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  
  # Define writable volumes
  volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
